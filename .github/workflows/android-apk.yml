name: Build Android APK

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  pull_request:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Android debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android API
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle -p android :app:assembleDebug --no-daemon

      - name: Prepare downloadable APK
        run: |
          mkdir -p android/app/build/outputs/release-assets
          cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/release-assets/tmhi-control-center-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: tmhi-control-center-debug-apk
          path: android/app/build/outputs/release-assets/tmhi-control-center-debug.apk

      - name: Publish current Android APK release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION_NAME="$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' android/app/build.gradle.kts | head -n 1)"
          RELEASE_NOTES="Android ${VERSION_NAME} debug APK built from ${GITHUB_SHA}. This APK is for testing and is not a Play Store release."
          if gh release view android-latest >/dev/null 2>&1; then
            gh release delete android-latest --cleanup-tag --yes
          fi
          gh release create android-latest \
            android/app/build/outputs/release-assets/tmhi-control-center-debug.apk \
            --target "$GITHUB_SHA" \
            --title "TMHI Control Center Android ${VERSION_NAME}" \
            --notes "$RELEASE_NOTES" \
            --latest
