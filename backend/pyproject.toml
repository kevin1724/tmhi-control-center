[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "tmhi-control-center"
version = "0.1.1"
description = "Local Docker control center for supported T-Mobile Home Internet gateways"
readme = "../README.md"
requires-python = ">=3.11"
license = {file = "../LICENSE"}
authors = [{name = "Kevin Ruiz"}]
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.scripts]
tmhi-control-center = "tmhi_control_center.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tmhi_control_center = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
